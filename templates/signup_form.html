<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Signup - HarayaHomes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='LoginSignup/style.css') }}">
</head>
<body>
    <main>
        <div class="box">
            <div class="inner-box">
                <div class="forms-wrap">
                    <form action="{{ url_for('signup_from_email', token=token) }}" method="POST" autocomplete="off" class="sign-up-form">
                        <div class="logo">
                            <img src="{{ url_for('static', filename='LoginSignup/img/Logo-Black.png') }}" alt="HarayaHomes">
                            <h4>HarayaHomes</h4>
                        </div>

                        <div class="heading">
                            <h2>Complete Your Signup</h2>
                            <h6>Your application has been approved!</h6>
                        </div>

                        <div class="actual-form">
                            <input type="hidden" name="email" value="{{ email }}">
                            
                            <div class="input-wrap">
                                <input type="text" name="fname" minlength="2" class="input-field" autocomplete="off" required />
                                <label>First Name</label>
                            </div>

                            <div class="input-wrap">
                                <input type="text" name="lname" minlength="2" class="input-field" autocomplete="off" required />
                                <label>Last Name</label>
                            </div>

                            <div class="input-wrap">
                                <input type="email" name="email_display" class="input-field" value="{{ email }}" disabled />
                                <label>Email (from application)</label>
                            </div>

                            <div class="input-wrap">
                                <input type="password" name="password" minlength="8" class="input-field" autocomplete="off" required />
                                <label>Password (min. 8 characters)</label>
                            </div>

                            <div class="input-wrap">
                                <input type="password" name="confirm_password" minlength="8" class="input-field" autocomplete="off" required />
                                <label>Confirm Password</label>
                            </div>

                            <input type="hidden" name="role" value="seller">

                            <input type="submit" value="Complete Signup" class="sign-btn" />

                            <p class="text">
                                Already have an account?
                                <a href="{{ url_for('login') }}">Log in</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
